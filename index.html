<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Engineering Workshop</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Icon sprite: one <symbol> per icon, used everywhere via <use href="#icon-name">. -->
<svg style="display:none" aria-hidden="true">
  <symbol id="icon-spark" viewBox="0 0 24 24"><path d="M12 2c.6 3.4 1.4 5.6 2.6 6.8S18.6 11.4 22 12c-3.4.6-5.6 1.4-6.8 2.6S12.6 18.6 12 22c-.6-3.4-1.4-5.6-2.6-6.8S5.4 12.6 2 12c3.4-.6 5.6-1.4 6.8-2.6S11.4 5.4 12 2Z"/></symbol>
  <symbol id="icon-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.2 11.1c.5.3.7.9.7 1.4v.5h5v-.5c0-.5.2-1.1.7-1.4A6 6 0 0 0 12 3Z"/></symbol>
  <symbol id="icon-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5V5.5Z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></symbol>
  <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="icon-compare" viewBox="0 0 24 24"><path d="M4 8h13"/><path d="M14 4l3 4-3 4"/><path d="M20 16H7"/><path d="M10 12l-3 4 3 4"/></symbol>
  <symbol id="icon-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></symbol>
  <symbol id="icon-repeat" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.7 5.7L4 16"/><path d="M4 20v-4h4"/></symbol>
  <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></symbol>
  <symbol id="icon-template" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
  <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5Z"/></symbol>
  <symbol id="icon-seed" viewBox="0 0 24 24"><path d="M12 21v-8"/><path d="M12 13c0-4-3-7-7-7 0 4 3 7 7 7Z"/><path d="M12 13c0-4 3-7 7-7 0 4-3 7-7 7Z"/></symbol>
  <symbol id="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
  <symbol id="icon-question" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.7"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="icon-checklist" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8l1.5 1.5L12 7"/><path d="M8 14l1.5 1.5L12 13"/><path d="M14 8.5h4M14 14.5h4"/></symbol>
  <symbol id="icon-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="icon-layers" viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M2 13l10 5 10-5"/></symbol>
  <symbol id="icon-tag" viewBox="0 0 24 24"><path d="M20 12.5 12.5 20 3 10.5V4a1 1 0 0 1 1-1h6.5L20 12.5Z"/><circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"/></symbol>
  <symbol id="icon-inbox" viewBox="0 0 24 24"><path d="M3 12h5l2 3h4l2-3h5"/><path d="M5 5h14l2 7v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-7l2-7Z"/></symbol>
  <symbol id="icon-wrench" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 1-5.4 5.4L4 17l3 3 5.1-5.1a4 4 0 0 1 5.4-5.4l-2.6 2.6-2-2 2.6-2.6Z"/></symbol>
  <symbol id="icon-steps" viewBox="0 0 24 24"><path d="M4 20v-4h4v-4h4V8h4V4"/></symbol>
  <symbol id="icon-checkpoint" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="icon-check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></symbol>
  <symbol id="icon-output" viewBox="0 0 24 24"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M4 14h4l2 3h4l2-3h4v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-6Z"/></symbol>
  <symbol id="icon-rules" viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M9 9h6M9 13h6M9 17h4"/></symbol>
  <symbol id="icon-swap" viewBox="0 0 24 24"><path d="M7 7h11l-3-3"/><path d="M17 17H6l3 3"/></symbol>
  <symbol id="icon-ruler" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="1"/><path d="M7 9v3M11 9v3M15 9v3M19 9v3"/></symbol>
  <symbol id="icon-flag" viewBox="0 0 24 24"><path d="M6 3v18"/><path d="M6 4h12l-3 4 3 4H6Z"/></symbol>
  <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
  <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></symbol>
  <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></symbol>
  <symbol id="icon-party" viewBox="0 0 24 24"><path d="M12 2l1.2 3.8L17 7l-3.8 1.2L12 12l-1.2-3.8L7 7l3.8-1.2L12 2Z"/><circle cx="5" cy="15" r="1.4"/><circle cx="19" cy="14" r="1.2"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1.3"/></symbol>
</svg>

<div class="app-shell">

  <aside class="toc-column">
    <div class="toc-heading" id="toc-heading"></div>
    <nav class="toc-list" id="toc-list" aria-label="Slide-navigatie"></nav>
  </aside>

  <main class="slide-column">
    <div class="slide-stage" id="slide-stage">
      <div class="disco-bg" aria-hidden="true">
        <div class="disco-rays"></div>
        <div class="disco-title" id="disco-title"></div>
        <svg class="icon icon--fill disco-sparkle disco-sparkle-1"><use href="#icon-spark"></use></svg>
        <svg class="icon icon--fill disco-sparkle disco-sparkle-2"><use href="#icon-spark"></use></svg>
        <svg class="icon icon--fill disco-sparkle disco-sparkle-3"><use href="#icon-spark"></use></svg>
        <svg class="icon icon--fill disco-sparkle disco-sparkle-4"><use href="#icon-spark"></use></svg>
        <svg class="icon icon--fill disco-sparkle disco-sparkle-5"><use href="#icon-spark"></use></svg>
        <svg class="icon icon--fill disco-sparkle disco-sparkle-6"><use href="#icon-spark"></use></svg>
        <svg class="icon icon--fill disco-sparkle disco-sparkle-7"><use href="#icon-spark"></use></svg>
        <svg class="icon icon--fill disco-sparkle disco-sparkle-8"><use href="#icon-spark"></use></svg>
        <svg class="icon icon--fill disco-sparkle disco-sparkle-9"><use href="#icon-spark"></use></svg>
        <svg class="icon icon--fill disco-sparkle disco-sparkle-10"><use href="#icon-spark"></use></svg>
        <svg class="icon icon--fill disco-sparkle disco-sparkle-11"><use href="#icon-spark"></use></svg>
        <svg class="icon icon--fill disco-sparkle disco-sparkle-12"><use href="#icon-spark"></use></svg>
      </div>
      <section class="slide-content" id="slide-content"></section>
      <section class="slide-notes" id="slide-notes"></section>
    </div>
  </main>

  <aside class="next-column">
    <div class="toc-widgets">
      <button id="btn-template" class="btn-floating btn-template" type="button">
        <svg class="icon"><use href="#icon-template"></use></svg>
        <span id="btn-template-label"></span>
      </button>

      <button id="btn-toggle-notes" class="btn-floating btn-toggle-notes" type="button">
        <svg class="icon"><use href="#icon-book"></use></svg>
        <span id="notes-toggle-label"></span>
      </button>

      <div class="timer-widget" id="timer-widget">
        <div class="timer-readout">
          <svg class="icon"><use href="#icon-clock"></use></svg>
          <span id="timer-display"></span>
        </div>
        <div class="timer-controls">
          <button id="btn-timer-toggle" class="btn-pill" type="button"></button>
          <button id="btn-timer-add5" class="btn-pill" type="button"><span id="timer-add5-label"></span></button>
        </div>
        <button id="btn-timer-finish" class="btn-finish" type="button">
          <svg class="icon icon--fill"><use href="#icon-party"></use></svg>
          <span id="btn-timer-finish-label"></span>
        </button>
      </div>
    </div>

    <div class="next-actions">
      <div class="slide-progress" id="slide-progress"></div>
      <button id="btn-next" class="btn-next" type="button">
        <svg class="icon"><use href="#icon-arrow-right"></use></svg>
        <span id="btn-next-label"></span>
      </button>
      <button id="btn-prev" class="btn-prev" type="button">
        <svg class="icon"><use href="#icon-arrow-left"></use></svg>
        <span id="btn-prev-label"></span>
      </button>
    </div>
  </aside>

</div>

<div class="overlay-backdrop" id="template-overlay" hidden>
  <div class="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <button class="overlay-close" id="btn-overlay-close" type="button">
      <svg class="icon"><use href="#icon-close"></use></svg>
    </button>
    <h2 id="overlay-title">
      <svg class="icon"><use href="#icon-template"></use></svg>
      <span id="overlay-title-text"></span>
    </h2>
    <div class="overlay-body" id="overlay-body"></div>
  </div>
</div>

<div class="finish-overlay" id="finish-overlay" hidden>
  <button class="overlay-close" id="btn-finish-close" type="button">
    <svg class="icon"><use href="#icon-close"></use></svg>
  </button>
  <div class="finish-content">
    <svg class="icon finish-icon icon--fill"><use href="#icon-party"></use></svg>
    <h2 id="finish-title"></h2>
    <p id="finish-body"></p>
    <button class="btn-back-to-deck" id="btn-finish-back" type="button">
      <svg class="icon"><use href="#icon-arrow-left"></use></svg>
      <span id="finish-back-label"></span>
    </button>
  </div>
</div>

<canvas id="confetti-canvas"></canvas>

<script src="config.js"></script>
<script src="slides-data.js"></script>
<script src="app.js"></script>
</body>
</html>
