<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenter View</title>
<script src="config.js"></script>
<script>document.documentElement.setAttribute('data-theme', (typeof CONFIG !== 'undefined' && CONFIG.theme) || 'default');</script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="themes/conclusion/theme.css">
<link rel="stylesheet" href="presenter.css">
</head>
<body>

<header class="presenter-header">
  <div class="presenter-heading">
    <span class="presenter-kicker" data-i18n="presenterMode">Presentatieweergave</span>
  </div>
</header>

<div class="connection-banner" id="connection-banner" data-connected="false" role="status">
  <span class="connection-dot" aria-hidden="true"></span>
  <div>
    <strong data-connection-status>Niet verbonden</strong>
    <p data-connection-hint data-i18n="connectionHint">Open deze pagina via de Presentatieweergave (de Presenter View-knop of Shift+P), niet rechtstreeks.</p>
  </div>
</div>

<main id="presenter-main" class="presenter-main" hidden>
  <section class="preview-grid" aria-label="Slidevoorbeelden" data-i18n-aria-label="slidePreviews">
    <article class="panel preview-card preview-card--current">
      <div class="preview-viewport">
        <iframe id="current-preview" src="index.html?embed=preview" class="preview-frame" title="Voorbeeld van de huidige slide" data-i18n-title="currentPreviewTitle"></iframe>
        <div class="disco-still" data-disco-still hidden>
          <div class="disco-still-title" data-disco-still-title></div>
          <span class="disco-still-label" data-i18n="discoStillLabel">Dit ziet je publiek nu — een still, niet live</span>
        </div>
      </div>
    </article>

    <nav class="preview-nav" aria-label="Presentatiebediening" data-i18n-aria-label="presentationControls">
      <span class="slide-chip">Slide <strong data-current-slide></strong> / <span data-total-slides></span></span>
      <div class="nav-controls">
        <button id="btn-presenter-prev" class="btn btn--nav" type="button"><span aria-hidden="true">&#8592;</span> <span data-i18n="previous">Vorige</span></button>
        <button id="btn-presenter-next" class="btn btn--primary btn--nav" type="button"><span data-i18n="next">Volgende</span> <span aria-hidden="true">&#8594;</span></button>
        <button id="btn-presenter-skip" class="btn btn--quiet btn--nav" type="button" data-i18n="skipOneSlide" data-i18n-title="skipOneSlideHint" title="Eerst klikken om te activeren, dan nogmaals om één slide over te slaan">Sla over</button>
      </div>
    </nav>

    <article class="panel preview-card preview-card--next">
      <div class="preview-viewport">
        <iframe id="next-preview" src="index.html?embed=preview" class="preview-frame" title="Voorbeeld van de volgende slide" data-i18n-title="nextPreviewTitle"></iframe>
      </div>
    </article>
  </section>

  <section class="detail-grid">
    <article class="panel notes-panel">
      <header class="panel-header panel-header--compact">
        <span class="panel-kicker" data-i18n="speakerNotes">Sprekersnotities</span>
      </header>
      <div id="presenter-notes" class="presenter-notes"></div>
    </article>

    <div class="presenter-sidebar">
      <section class="panel controls-panel" aria-label="Weergaveopties" data-i18n-aria-label="displayOptions">
        <span class="panel-kicker" data-i18n="display">Weergave</span>
        <div class="display-controls">
          <button id="btn-toggle-left-aside" class="btn btn--display-toggle" type="button" aria-pressed="false">
            <span class="toggle-indicator" aria-hidden="true"></span>
            <span data-i18n="leftSidebar">Linker zijbalk</span>
            <strong class="toggle-status" data-left-aside></strong>
          </button>
          <button id="btn-toggle-right-aside" class="btn btn--display-toggle" type="button" aria-pressed="false">
            <span class="toggle-indicator" aria-hidden="true"></span>
            <span data-i18n="rightSidebar">Rechter zijbalk</span>
            <strong class="toggle-status" data-right-aside></strong>
          </button>
          <button id="btn-toggle-pause-overlay" class="btn btn--display-toggle" type="button" aria-pressed="false">
            <span class="toggle-indicator" aria-hidden="true"></span>
            <span data-i18n="pauseScreen">Pauzescherm</span>
            <strong class="toggle-status" data-pause-overlay></strong>
          </button>
          <button id="btn-toggle-context-overlay" class="btn btn--display-toggle" type="button" aria-pressed="false">
            <span class="toggle-indicator" aria-hidden="true"></span>
            <span data-i18n="contextOverlay">Context-overlay</span>
            <strong class="toggle-status" data-context-overlay></strong>
          </button>
        </div>
      </section>

      <div class="header-timer" aria-label="Presentatietijd" data-i18n-aria-label="presentationTiming">
        <div class="elapsed-block">
          <span class="meta-label" data-i18n="timerLabel">Resterende tijd</span>
          <input type="text" class="elapsed" data-elapsed inputmode="numeric" autocomplete="off"
            aria-label="Tijdsduur instellen (MM:SS of minuten), alleen als de timer niet loopt"
            data-i18n-aria-label="setTimerDuration">
        </div>
        <div class="timer-controls" aria-label="Timerbediening" data-i18n-aria-label="timerControls">
          <button id="btn-presenter-timer-toggle" class="btn btn--primary" type="button" data-i18n="start">Start</button>
          <button id="btn-presenter-timer-reset" class="btn btn--quiet" type="button" data-i18n="reset">Reset</button>
        </div>
        <div class="clock-block">
          <span class="meta-label" data-i18n="currentTime">Huidige tijd</span>
          <time class="clock clock--compact" data-clock></time>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="slides-data.js"></script>
<script src="presenter.js"></script>
</body>
</html>
